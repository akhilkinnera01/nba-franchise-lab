cba_version: "2017"
effective_seasons:
  start: "2017-18"
  end: "2022-23"
threshold_sources:
  salary_cap_and_tax: "adapter-supplied or demo-fixture thresholds for {season}"
  rookie_scale_reference: "cbafaq.com/scale17.htm"
  minimum_salary_reference: "cbafaq.com/minimum.htm"
roster_limits:
  offseason_maximum: 20
  regular_season_standard_contracts: 15
  two_way_contracts: 2
  inactive_limit_per_game: 4
salary_maximums:
  experience_percentages:
    years_0_to_6: 0.25
    years_7_to_9: 0.30
    years_10_plus: 0.35
  designated_rookie_extension_percentages:
    standard: 0.25
    rose_rule: 0.30
  annual_raise_limits:
    bird_or_designated: 0.08
    non_bird_or_cap_room: 0.05
minimum_salary:
  determined_by_experience: true
  veteran_minimum_exception_available: true
rookie_scale:
  guaranteed_years: 2
  team_option_years:
    - 3
    - 4
  qualifying_offer_year: 5
bird_rights:
  full_bird_vested_after_seasons: 3
  early_bird_vested_after_seasons: 2
  non_bird_starting_salary_limit: "120% of previous salary or 120% of the minimum salary, whichever is greater"
  early_bird_starting_salary_limit: "175% of previous salary or 105% of the league average salary, whichever is greater"
trade_matching:
  simultaneous_aggregation_allowed: true
  non_taxpaying_team_rules:
    - outgoing_maximum: 6533333
      incoming_limit: "175% of outgoing salary plus $100,000"
    - outgoing_maximum: 19600000
      incoming_limit: "Outgoing salary plus $5,000,000"
    - outgoing_minimum: 19600001
      incoming_limit: "125% of outgoing salary plus $100,000"
  taxpaying_team_rule:
    incoming_limit: "125% of outgoing salary plus $100,000"
  cash_in_trades_allowed: true
exceptions:
  mid_level:
    non_taxpayer:
      available: true
      hard_caps_team_at_apron: true
    taxpayer:
      available: true
    room:
      available_when_cap_room_used: true
  bi_annual_exception:
    available: true
    hard_caps_team_at_apron: true
sign_and_trade:
  allowed: true
  receiving_team_hard_cap_trigger: "Apron"
  base_year_compensation_applies: true
over_38_rule:
  applies_at_age: 38
apron_rules:
  first_apron_exists: false
  second_apron_exists: false
  hard_cap_apron_exists: true
notes:
  - "Season-specific salary cap, tax, and apron-equivalent threshold values must come from a rights-cleared adapter or demo fixture."
  - "The 2017 CBA rule set governs seasons before the second-apron regime introduced in the 2023 agreement."
