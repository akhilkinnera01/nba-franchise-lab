name: Bug report
description: Track a defect or regression
title: "[Bug]: "
labels:
  - type:bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include concrete reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, branch, and any relevant local setup details
  - type: checkboxes
    id: source_rights
    attributes:
      label: Source rights / provenance
      options:
        - label: This bug report does not require restricted source data to reproduce
        - label: Any attached sample data or asset can be shared publicly
        - label: I have not included credentials, private data, or unlicensed assets
